      }

      // CPAGrip Global Callback functions

      // CPAGrip PostMessage listener
      window.addEventListener("message", function(event) {
        if (!event) return;
        var data = event.data;
        if (typeof data === "string") {
          var lower = data.toLowerCase();
          if (
            lower.indexOf("complete") !== -1 ||
            lower.indexOf("unlock") !== -1 ||
            lower.indexOf("lead") !== -1 ||
            lower.indexOf("conversion") !== -1 ||
            lower.indexOf("offer_done") !== -1
          ) {
            onCpaOfferCompleted();
          }
        } else if (typeof data === "object" && data !== null) {
          if (
            data.status === "complete" ||
            data.status === "unlocked" ||
            data.action === "unlock" ||
            data.event === "complete" ||
            data.completed === true
          ) {
            onCpaOfferCompleted();
          }
        }
      }, false);
